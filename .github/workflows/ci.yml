name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
      - run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with: { name: vsix, path: "*.vsix" }
